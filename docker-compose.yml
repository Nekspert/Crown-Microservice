services:
  db:
    image: postgres:17.5-alpine
    container_name: db
    hostname: "${POSTGRES_HOST}"
    ports:
      - "5432:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - crown_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: redis
    hostname: "${REDIS_HOST}"
    ports:
      - "6379:${REDIS_PORT}"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  crown:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crown
    hostname: "${RUN_HOST}"
    ports:
      - "${RUN_PORT}:${RUN_PORT}"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  crown_pgdata:
