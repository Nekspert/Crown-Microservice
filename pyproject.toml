[project]
name = "crown-microservice"
version = "0.1.0"
description = ""
authors = [
    {name = "Timur Berezin",email = "corporate.timur01@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
]